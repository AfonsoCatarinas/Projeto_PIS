<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIS Admin - Dashboard</title>
    <style>
        :root {
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #0ea5e9;
            --text: #f1f5f9;
            --text-light: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: var(--dark-bg);
            color: var(--text);
            min-height: 100vh;
        }
        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .sidebar-header p {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .sidebar-nav {
            padding: 20px;
            flex: 1;
        }

        .sidebar-nav ul {
            list-style: none;
        }

        .sidebar-nav li {
            margin-bottom: 8px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
        }

        .sidebar-nav a.active {
            background: var(--accent);
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .admin-header {
            margin-bottom: 32px;
        }

        .admin-header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .stat-card h3 {
            color: var(--text-light);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .table-container h3 {
            color: var(--text);
            font-size: 1.125rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table thead {
            border-bottom: 2px solid var(--border);
        }

        table th {
            padding: 16px;
            text-align: left;
            color: var(--text-light);
            font-weight: 500;
            font-size: 0.875rem;
        }

        table td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        table tr:last-child td {
            border-bottom: none;
        }

        table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 24px;
        }

        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                width: 80px;
            }
            
            .sidebar-header h1,
            .sidebar-header p,
            .sidebar-nav a span {
                display: none;
            }
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .logout-btn {
            color: var(--danger);
            margin-top: auto;
        }

        .logout-btn:hover {
            color: white;
            background: var(--danger);
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>PIS Admin</h1>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="/backoffice" class="active">
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="/backoffice/movies">
                            <span>Filmes</span>
                        </a>
                    </li>
                    <li>
                        <a href="/backoffice/actors">
                            <span>Atores</span>
                        </a>
                    </li>
                    <li>
                        <a href="/backoffice/genres">
                            <span>Géneros</span>
                        </a>
                    </li>
                    <li>
                        <a href="/backoffice/users">
                            <span>Utilizadores</span>
                        </a>
                    </li>
                    <li>
                        <a href="/backoffice/reviews">
                            <span>Reviews</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" onclick="logout()" class="logout-btn">
                            <span>Logout</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="admin-header">
                <h1>Dashboard</h1>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Filmes</h3>
                    <div class="number" id="total-movies">0</div>
                </div>

                <div class="stat-card">
                    <h3>Utilizadores</h3>
                    <div class="number" id="total-users">0</div>
                </div>

                <div class="stat-card">
                    <h3>Atores</h3>
                    <div class="number" id="total-actors">0</div>
                </div>

                <div class="stat-card">
                    <h3>Reviews</h3>
                    <div class="number" id="total-reviews">0</div>
                </div>
            </div>

            <div class="content-grid">
                <div class="table-container">
                    <h3>Últimos Filmes</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Ano</th>
                            </tr>
                        </thead>
                        <tbody id="recent-movies">
                            <!-- carregar os filmes -->
                        </tbody>
                    </table>
                </div>

                <div class="table-container">
                    <h3>Últimas Reviews</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Utilizador</th>
                                <th>Classificação</th>
                            </tr>
                        </thead>
                        <tbody id="recent-reviews">
                            <!-- Carregar as reviews -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
    // Função para carregar as estatísticas do sistema
    async function loadStats() {
        try {
            // Carrega a contagem de filmes da API
            const moviesRes = await fetch('/api/movies');
            if (moviesRes.ok) {
                const movies = await moviesRes.json();
                document.getElementById('total-movies').textContent = movies.length;
            }

            // Carrega a contagem de atores da API
            const actorsRes = await fetch('/api/actors');
            if (actorsRes.ok) {
                const actors = await actorsRes.json();
                document.getElementById('total-actors').textContent = actors.length;
            }

            // Carrega a contagem de utilizadores da API
            // Precisa de token porque apenas administradores podem ver utilizadores
            const token = localStorage.getItem('token');
            const usersRes = await fetch('/api/auth/users', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (usersRes.ok) {
                const users = await usersRes.json();
                document.getElementById('total-users').textContent = users.length;
            }

            // Carrega a contagem de avaliações (reviews) da API
            const reviewsRes = await fetch('/api/reviews', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (reviewsRes.ok) {
                const reviews = await reviewsRes.json();
                document.getElementById('total-reviews').textContent = reviews.length;
            }

        } catch (error) {
            console.error('Erro ao carregar estatísticas:', error);
            alert('Erro ao carregar estatísticas');
        }
    }

    // Função para carregar os filmes mais recentes
    async function loadRecentMovies() {
        try {
            // Faz pedido à API para obter todos os filmes
            const response = await fetch('/api/movies');
            
            if (response.ok) {
                const movies = await response.json();
                // Pega os 5 filmes mais recentes
                const recentMovies = movies.slice(0, 5);
                
                let html = '';
                // Cria uma linha na tabela para cada filme
                recentMovies.forEach(movie => {
                    html += `
                        <tr>
                            <td>${movie.title}</td>
                            <td>${movie.release_year || 'N/A'}</td>
                        </tr>
                    `;
                });
                
                // Insere o HTML na tabela de filmes recentes
                document.getElementById('recent-movies').innerHTML = html;
            }
        } catch (error) {
            console.error('Erro ao carregar filmes:', error);
            alert('Erro ao carregar filmes');
        }
    }

    // Função para carregar as avaliações mais recentes
    async function loadRecentReviews() {
        try {
            const token = localStorage.getItem('token');
            
            // Faz pedido à API para obter todas as avaliações
            const response = await fetch('/api/reviews', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.ok) {
                const reviews = await response.json();
                // Pega as 5 avaliações mais recentes
                const recentReviews = reviews.slice(0, 5);
                
                let html = '';
                // Cria uma linha na tabela para cada avaliação
                recentReviews.forEach(review => {
                    html += `
                        <tr>
                            <td>${review.user_name || 'Utilizador'}</td>
                            <td>${review.rating} estrelas</td>
                        </tr>
                    `;
                });
                
                // Insere o HTML na tabela de avaliações recentes
                document.getElementById('recent-reviews').innerHTML = html;
            }
        } catch (error) {
            console.error('Erro ao carregar reviews:', error);
            alert('Erro ao carregar avaliações');
        }
    }

    // Função para terminar a sessão do administrador
    function logout() {
        if (confirm('Deseja terminar sessão?')) {
            localStorage.removeItem('token'); // Remove o token de autenticação
            window.location.href = '/frontoffice'; // Redireciona para a página inicial
        }
    }

    // Código executado quando a página carrega
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Dashboard do administrador carregado');
        
        // Verifica se o utilizador está autenticado
        const token = localStorage.getItem('token');
        if (!token) {
            alert('Sessão expirada. Faça login novamente.');
            window.location.href = '/frontoffice/login';
            return;
        }
        
        // Verifica se o utilizador é administrador
        try {
            // Decodifica o token JWT para verificar se é administrador
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (!payload.is_admin) {
                alert('Acesso negado. Apenas administradores.');
                window.location.href = '/frontoffice';
                return;
            }
        } catch (error) {
            console.error('Token inválido:', error);
            localStorage.removeItem('token');
            window.location.href = '/frontoffice/login';
            return;
        }
        
        // Carrega todos os dados do dashboard
        loadStats();        // Estatísticas gerais
        loadRecentMovies(); // Filmes recentes
        loadRecentReviews(); // Avaliações recentes
        
        // Atualiza as estatísticas automaticamente a cada 30 segundos
        setInterval(loadStats, 30000);
    });
</script>
</body>
</html>
