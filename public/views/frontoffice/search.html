<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIS Movies - Pesquisar</title>
    <style>
        :root {
            --dark-bg: #040714;
            --card-bg: #0c111b;
            --accent: #0063e5;
            --accent-hover: #0483ee;
            --text: #f9f9f9;
            --text-light: #c0c0c0;
            --border: #2a2a3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: var(--dark-bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--dark-bg);
            padding: 20px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
            padding: 8px 12px;
            border-radius: 4px;
        }

        nav a:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        nav a.active {
            color: var(--accent);
            background: rgba(0, 99, 229, 0.1);
        }

        main {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
            width: 100%;
        }

        .page-title {
            margin-bottom: 40px;
            text-align: center;
        }

        .page-title h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text);
        }

        .page-title p {
            color: var(--text-light);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .search-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 40px;
        }

        .search-bar {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 99, 229, 0.2);
        }

        .search-input:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .search-input::placeholder {
            color: var(--text-light);
        }

        .btn {
            padding: 16px 32px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 99, 229, 0.3);
        }

        .search-filters {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group label {
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 500;
        }

        select {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.9rem;
            cursor: pointer;
            min-width: 150px;
        }

        .search-results {
            margin-top: 20px;
        }

        .results-count {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 99, 229, 0.2);
        }

        .movie-poster-container {
            height: 350px;
            overflow: hidden;
            position: relative;
        }

        .movie-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.05);
        }

        .movie-content {
            padding: 20px;
        }

        .movie-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
            line-height: 1.3;
            display: -webkit-box;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .movie-year {
            color: var(--accent);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .movie-genre {
            color: var(--text-light);
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 4px;
        }

        .movie-description {
            color: var(--text-light);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
            display: -webkit-box;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .movie-actions {
            display: flex;
            justify-content: center;
        }

        .view-btn {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(0, 99, 229, 0.1);
            border: 1px solid rgba(0, 99, 229, 0.3);
            color: var(--accent);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s;
            width: auto;
            text-align: center;
        }

        .view-btn:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-2px);
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-light);
            grid-column: 1 / -1;
        }

        .empty-state h3 {
            color: var(--text);
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-light);
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 40px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .page-btn {
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            cursor: pointer;
        }

        .page-btn:hover {
            border-color: var(--accent);
            background: rgba(0, 99, 229, 0.1);
        }

        .page-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .page-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .page-info {
            color: var(--text-light);
            font-size: 0.9rem;
            margin: 0 15px;
        }

        /* Efeitos de hover aprimorados */
.movie-card {
    position: relative;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.movie-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to bottom, transparent 60%, rgba(0, 99, 229, 0.1));
    border-radius: 12px;
    opacity: 0;
    transition: opacity 0.3s;
}

.movie-card:hover::before {
    opacity: 1;
}

.movie-director {
    color: var(--text-light);
    font-size: 0.85rem;
    background: rgba(255, 255, 255, 0.05);
    padding: 4px 8px;
    border-radius: 4px;
}

/* Botão de visualizar melhorado */
.view-btn {
    width: 100%;
    text-align: center;
    padding: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    border: none;
    color: white;
    transition: all 0.3s;
}

.view-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(0, 99, 229, 0.4);
}

/* Estado de loading animado */
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.loading {
    animation: pulse 1.5s ease-in-out infinite;
}

/* Empty state melhorado */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    text-align: center;
}

.empty-state svg {
    margin-bottom: 20px;
    color: var(--accent);
    opacity: 0.5;
}

.empty-state h3 {
    font-size: 1.5rem;
    margin-bottom: 10px;
    color: var(--text);
}

.empty-state p {
    color: var(--text-light);
    max-width: 400px;
    line-height: 1.6;
}

/* Responsividade adicional */
@media (max-width: 768px) {
    .movie-card {
        flex-direction: column;
    }
    
    .view-btn {
        padding: 10px;
        font-size: 0.9rem;
    }
}

        @media (max-width: 1200px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 768px) {
            header, main {
                padding: 20px;
            }
            
            .header-container {
                flex-direction: column;
                gap: 15px;
            }
            
            nav ul {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .page-title h1 {
                font-size: 2rem;
            }
            
            .search-bar {
                flex-direction: column;
            }
            
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
            }
            
            .movie-poster-container {
                height: 300px;
            }
            
            .search-filters {
                flex-direction: column;
                align-items: center;
            }
            
            .pagination {
                flex-wrap: wrap;
            }
            
            .view-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 480px) {
            .movies-grid {
                grid-template-columns: 1fr;
            }
            
            .page-title h1 {
                font-size: 1.8rem;
            }
            
            .search-container {
                padding: 20px;
            }
            
            .movie-content {
                padding: 15px;
            }
        }

        footer {
            background: var(--card-bg);
            padding: 30px 40px;
            text-align: center;
            border-top: 1px solid var(--border);
            margin-top: 60px;
        }

        footer p {
            color: var(--text-light);
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/frontoffice" class="logo">PIS MOVIES</a>
            <nav>
                <ul>
                    <li><a href="/frontoffice">Início</a></li>
                    <li><a href="/frontoffice/movies">Filmes</a></li>
                    <li><a href="/frontoffice/search" class="active">Pesquisar</a></li>
                    <li id="auth-links">
                        <a href="/frontoffice/login">Login</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="page-title">
            <h1>Pesquisar Filmes</h1>
            <p>Encontre os filmes que procura utilizando a pesquisa por título, descrição ou filtros específicos.</p>
        </div>

        <div class="search-container">
            <div class="search-bar">
                <input type="text" id="search-input" class="search-input" 
                       placeholder="Pesquisar por título, descrição..." 
                       onkeypress="if(event.key === 'Enter') performSearch()">
                <button onclick="performSearch()" class="btn">Pesquisar</button>
            </div>             
        </div>

        <div class="search-results">
            <div class="results-count" id="results-count">
                Digite para pesquisar
            </div>
            
            <div class="movies-grid" id="search-results-container">
                <!-- Resultados aparecerão aqui -->
            </div>

            <div class="pagination" id="pagination" style="display: none;">
                <button class="page-btn" id="prev-page" onclick="changePage(-1)">
                    Anterior
                </button>
                
                <div id="page-numbers" style="display: flex; gap: 5px;">
                    <!-- Páginas serão geradas aqui -->
                </div>
                
                <button class="page-btn" id="next-page" onclick="changePage(1)">
                    Próxima
                </button>
                
                <div class="page-info" id="page-info">
                    Página <span id="current-page">1</span> de <span id="total-pages">1</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>PIS Movies &copy; 2025 - O seu portal definitivo para o mundo do cinema</p>
    </footer>

    <script src="/js/main.js"></script>
</body>
</html>
