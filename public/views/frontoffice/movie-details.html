<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIS Movies - Detalhes do Filme</title>
    <style>
        :root {
            --dark-bg: #040714;
            --card-bg: #0c111b;
            --accent: #0063e5;
            --accent-hover: #0483ee;
            --text: #f9f9f9;
            --text-light: #c0c0c0;
            --border: #2a2a3c;
            --gold: #ffd700;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: var(--dark-bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--dark-bg);
            padding: 20px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.05);
        }

        nav a.active {
            color: var(--accent);
            background: rgba(0, 99, 229, 0.1);
        }

        .auth-btn {
            background: var(--accent);
            color: white !important;
            padding: 8px 20px !important;
            font-weight: 600;
        }

        .auth-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        main {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
            width: 100%;
        }

        .movie-hero {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 40px;
            margin-bottom: 40px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
            align-items: start;
        }

        .movie-poster-container {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .movie-poster {
            width: 100%;
            height: 450px;
            object-fit: cover;
            display: block;
        }

        .movie-info h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text);
            line-height: 1.2;
        }

        .movie-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            color: var(--text-light);
            font-size: 0.95rem;
            align-items: center;
        }

        .movie-year {
            color: var(--accent);
            font-weight: 500;
        }

        .movie-genres {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .genre-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-light);
            transition: all 0.3s ease;
        }

        .genre-tag:hover {
            border-color: var(--accent);
            background: rgba(0, 99, 229, 0.1);
        }

        .movie-synopsis {
            line-height: 1.7;
            color: var(--text-light);
            margin-bottom: 30px;
            font-size: 1.05rem;
        }

        .movie-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            border-color: var(--accent);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
        }

        .movie-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 99, 229, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            background: rgba(0, 99, 229, 0.1);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .reviews-section {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 40px;
            margin-bottom: 40px;
        }

        .reviews-section h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: var(--text);
            font-weight: 600;
        }

        .reviews-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .review-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .review-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .reviewer-info h4 {
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text);
        }

        .review-date {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .review-rating {
            color: var(--gold);
            font-weight: 600;
            font-size: 1rem;
        }

        .review-comment {
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .review-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .useful-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .useful-btn:hover {
            border-color: var(--success);
            color: var(--success);
        }

        .add-review-form {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 30px;
            margin-top: 30px;
        }

        .add-review-form h3 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text);
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-light);
            font-size: 0.9rem;
            font-weight: 500;
        }

        select, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: inherit;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .loading:after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .hidden {
            display: none !important;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: var(--text-light);
        }

        .empty-state h3 {
            color: var(--text);
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            .movie-hero {
                grid-template-columns: 250px 1fr;
                padding: 30px;
            }
        }

        @media (max-width: 768px) {
            .movie-hero {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 30px;
            }
            
            .movie-poster-container {
                max-width: 250px;
                margin: 0 auto;
            }
            
            .movie-poster {
                height: 350px;
            }
            
            .movie-genres {
                justify-content: center;
            }
            
            .movie-actions {
                justify-content: center;
            }
            
            .reviews-container {
                grid-template-columns: 1fr;
            }
            
            header {
                padding: 15px 20px;
            }
            
            nav ul {
                gap: 15px;
            }
            
            main {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .movie-info h1 {
                font-size: 2rem;
            }
            
            .movie-meta {
                flex-direction: column;
                gap: 10px;
                align-items: center;
            }
            
            .movie-stats {
                grid-template-columns: 1fr;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
            
            .movie-actions {
                flex-direction: column;
            }
        }

        footer {
            background: var(--card-bg);
            padding: 30px 40px;
            text-align: center;
            border-top: 1px solid var(--border);
            margin-top: 60px;
        }

        footer p {
            color: var(--text-light);
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/frontoffice" class="logo">PIS MOVIES</a>
            <nav>
                <ul>
                    <li><a href="/frontoffice">Início</a></li>
                    <li><a href="/frontoffice/movies">Filmes</a></li>
                    <li><a href="/frontoffice/search">Pesquisar</a></li>
                    <li id="auth-links">
                        <a href="/frontoffice/login" class="auth-btn">Login</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div id="movie-details-container">
            <div class="loading">A carregar detalhes do filme...</div>
        </div>

        <section class="reviews-section">
            <h2>Avaliações</h2>
            <div id="reviews-container">
                <div class="loading">A carregar avaliações...</div>
            </div>
            
            <div id="add-review-form" class="hidden">
                <div class="add-review-form">
                    <h3>Adicionar Avaliação</h3>
                    <form id="review-form">
                        <div class="form-group">
                            <label for="review-rating">Classificação (1-5)</label>
                            <select id="review-rating" required>
                                <option value="">Selecionar classificação</option>
                                <option value="5">5 - Excelente</option>
                                <option value="4">4 - Bom</option>
                                <option value="3">3 - Regular</option>
                                <option value="2">2 - Fraco</option>
                                <option value="1">1 - Mau</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="review-comment">Comentário</label>
                            <textarea id="review-comment" 
                                      placeholder="Partilhe a sua opinião sobre o filme..."
                                      required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Publicar Avaliação</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>PIS Movies &copy; 2025 - Projeto Programação e Integração de Serviços</p>
    </footer>

<script>
    // Variáveis globais
    let currentUser = null; // Guarda dados do utilizador logado
    let currentMovieId = null; // Guarda ID do filme atual
    
    // Verifica se o utilizador está autenticado
    function checkAuth() {
        const token = localStorage.getItem('token');
        if (token) {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                currentUser = {
                    id: payload.id,
                    email: payload.email,
                    is_admin: payload.is_admin
                };
                updateAuthUI();
            } catch (error) {
                localStorage.removeItem('token');
            }
        }
    }
    
    // Atualiza a navegação conforme autenticação
    function updateAuthUI() {
        const authLinks = document.getElementById('auth-links');
        if (authLinks && currentUser) {
            authLinks.innerHTML = `
                <a href="/frontoffice/profile" class="auth-btn">${currentUser.email}</a>
            `;
        }
        
        // Mostra formulário de review se utilizador autenticado
        const reviewForm = document.getElementById('add-review-form');
        if (reviewForm && currentUser) {
            reviewForm.classList.remove('hidden');
        }
    }
    
    // Termina sessão
    function logout() {
        localStorage.removeItem('token');
        currentUser = null;
        window.location.href = '/frontoffice';
    }
    
    // Carrega detalhes do filme
    async function loadMovieDetails() {
        try {
            // Obtém ID do filme da URL
            const match = window.location.pathname.match(/\/movie\/(\d+)/);
            currentMovieId = match ? match[1] : null;
            
            if (!currentMovieId) {
                showMovieNotFound();
                return;
            }
            
            // Carrega filme e reviews ao mesmo tempo
            const [movieResponse, reviewsResponse] = await Promise.all([
                fetch(`/api/movies/${currentMovieId}`),
                fetch(`/api/reviews/movie/${currentMovieId}`)
            ]);
            
            if (!movieResponse.ok) {
                showMovieNotFound();
                return;
            }
            
            const movie = await movieResponse.json();
            const reviews = reviewsResponse.ok ? await reviewsResponse.json() : [];
            
            // Adiciona reviews ao filme
            movie.reviews = reviews;
            
            // Mostra detalhes do filme
            await renderMovieDetails(movie);
            
        } catch (error) {
            console.error('Erro:', error);
            showMovieError();
        }
    }
    
    // Mostra detalhes do filme na página
    async function renderMovieDetails(movie) {
        const container = document.getElementById('movie-details-container');
        
        // Calcula classificação média
        let avgRating = 'N/A';
        if (movie.reviews && movie.reviews.length > 0) {
            const sum = movie.reviews.reduce((total, review) => total + review.rating, 0);
            avgRating = (sum / movie.reviews.length).toFixed(1);
        }
        
        // Se API já der rating, usa esse
        if (movie.average_rating) {
            avgRating = parseFloat(movie.average_rating).toFixed(1);
        }
        
        // Formata duração
        const duration = movie.duration ? `${movie.duration} min` : 'N/A';
        
        // Obtém nome do realizador
        let directorName = 'N/A';
        if (movie.director_name) {
            directorName = movie.director_name;
        }
        
        // Verifica se está nos favoritos
        let isFavorite = false;
        let favoriteButtonText = 'Adicionar aos Favoritos';
        let favoriteButtonClass = 'btn-secondary';
        
        if (currentUser) {
            isFavorite = await checkIfFavorite(movie.id);
            if (isFavorite) {
                favoriteButtonText = 'Remover dos Favoritos';
                favoriteButtonClass = 'btn-danger';
            }
        }
        
        // Cria HTML do filme
        container.innerHTML = `
            <div class="movie-hero fade-in">
                <!-- Poster -->
                <div class="movie-poster-container">
                    <img src="${movie.poster_url || 'https://via.placeholder.com/300x450?text=Sem+Poster'}" 
                         alt="${movie.title}" 
                         class="movie-poster">
                </div>
                
                <!-- Informações -->
                <div class="movie-info">
                    <h1>${movie.title} ${movie.release_year ? `(${movie.release_year})` : ''}</h1>
                    
                    <div class="movie-meta">
                        ${movie.release_year ? `<span class="movie-year">${movie.release_year}</span><span>•</span>` : ''}
                        <span>${duration}</span>
                        ${avgRating !== 'N/A' ? `<span>•</span><span>Classificação: ${avgRating}/5</span>` : ''}
                    </div>
                    
                    <!-- Géneros -->
                    ${movie.genres && movie.genres.length > 0 ? `
                        <div class="movie-genres">
                            ${movie.genres.map(genre => 
                                `<span class="genre-tag">${genre.name}</span>`
                            ).join('')}
                        </div>
                    ` : ''}
                    
                    <!-- Sinopse -->
                    ${movie.synopsis ? `
                        <p class="movie-synopsis">${movie.synopsis}</p>
                    ` : ''}
                    
                    <!-- Realizador e botões -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding: 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 8px;">
                        <div>
                            <div style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 5px;">Realizador</div>
                            <div style="font-size: 1.2rem; font-weight: 600; color: var(--accent);">${directorName}</div>
                        </div>
                        
                        <div style="display: flex; gap: 15px;">
                            ${movie.trailer_url ? `
                                <a href="${movie.trailer_url}" 
                                   target="_blank" 
                                   class="btn btn-primary">
                                    Ver Trailer
                                </a>
                            ` : ''}
                        </div>
                    </div>
                    
                    <!-- Botão de Favoritos -->
                    ${currentUser ? `
                        <div style="text-align: left; margin-top: 20px;">
                            <button onclick="toggleFavorite(${movie.id})" 
                                    class="btn ${favoriteButtonClass}" 
                                    style="width: auto; padding: 12px 30px;" 
                                    id="favorite-btn-${movie.id}">
                                ${favoriteButtonText}
                            </button>
                        </div>
                    ` : ''}
                </div>
            </div>
        `;
        
        // Mostra reviews
        displayReviews(movie.reviews || []);
    }
    
    // Mostra mensagem de filme não encontrado
    function showMovieNotFound() {
        const container = document.getElementById('movie-details-container');
        container.innerHTML = `
            <div class="empty-state">
                <h3>Filme Não Encontrado</h3>
                <p>O filme que procura não existe ou foi removido.</p>
                <a href="/frontoffice/movies" class="btn btn-primary" style="margin-top: 20px;">
                    Voltar ao Catálogo
                </a>
            </div>
        `;
    }
    
    // Mostra mensagem de erro
    function showMovieError() {
        const container = document.getElementById('movie-details-container');
        container.innerHTML = `
            <div class="empty-state">
                <h3>Erro ao Carregar</h3>
                <p>Ocorreu um erro ao carregar os detalhes do filme.</p>
                <button onclick="location.reload()" class="btn btn-primary" style="margin-right: 10px; margin-top: 20px;">
                    Tentar Novamente
                </button>
                <a href="/frontoffice/movies" class="btn btn-secondary" style="margin-top: 20px;">
                    Voltar aos Filmes
                </a>
            </div>
        `;
    }
    
    // Mostra reviews na página
    function displayReviews(reviews) {
        const container = document.getElementById('reviews-container');
        
        if (!reviews || reviews.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>Este filme ainda não tem avaliações.</h3>
                    ${currentUser ? `
                        <p style="margin-top: 10px; color: var(--accent);">
                            Seja o primeiro a avaliar!
                        </p>
                    ` : `
                        <p style="margin-top: 10px;">
                            <a href="/frontoffice/login" style="color: var(--accent);">Faça login</a> para adicionar uma avaliação.
                        </p>
                    `}
                </div>
            `;
            return;
        }
        
        container.innerHTML = reviews.map(review => `
            <div class="review-card fade-in">
                <div class="review-header">
                    <div class="reviewer-info">
                        <h4>${review.user_name}</h4>
                        <div class="review-date">
                            ${new Date(review.created_at).toLocaleDateString('pt-PT')}
                        </div>
                    </div>
                    <div class="review-rating">
                        ${review.rating}/5
                    </div>
                </div>
                
                <p class="review-comment">${review.comment}</p>
                
                <div class="review-actions">
                    <button onclick="voteUseful(${review.id})" 
                            class="useful-btn">
                        Útil (${review.useful_votes || 0})
                    </button>
                </div>
            </div>
        `).join('');
    }
    
    // FUNÇÕES DE FAVORITOS (NÃO ALTERAR)
    async function checkIfFavorite(movieId) {
        if (!currentUser) return false;
        
        try {
            const token = localStorage.getItem('token');
            const response = await fetch('/api/movies/user/favorites', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (!response.ok) return false;
            
            const favorites = await response.json();
            return favorites.some(fav => fav.id === parseInt(movieId));
            
        } catch (error) {
            console.error('Erro:', error);
            return false;
        }
    }
    
    async function toggleFavorite(movieId) {
        if (!currentUser) {
            alert('Precisa de fazer login para gerir favoritos.');
            window.location.href = '/frontoffice/login';
            return;
        }
        
        try {
            const token = localStorage.getItem('token');
            const isCurrentlyFavorite = await checkIfFavorite(movieId);
            
            if (isCurrentlyFavorite) {
                // Remove dos favoritos
                const response = await fetch(`/api/movies/favorites/${movieId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    alert('Removido dos favoritos!');
                    updateFavoriteButton(movieId, false);
                }
            } else {
                // Adiciona aos favoritos
                const response = await fetch('/api/movies/favorites', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ movieId: parseInt(movieId) })
                });
                
                if (response.ok) {
                    alert('Adicionado aos favoritos!');
                    updateFavoriteButton(movieId, true);
                }
            }
            
        } catch (error) {
            alert('Erro ao atualizar favoritos.');
        }
    }
    
    function updateFavoriteButton(movieId, isFavorite) {
        const favoriteBtn = document.getElementById(`favorite-btn-${movieId}`);
        if (!favoriteBtn) return;
        
        if (isFavorite) {
            favoriteBtn.textContent = 'Remover dos Favoritos';
            favoriteBtn.classList.remove('btn-secondary');
            favoriteBtn.classList.add('btn-danger');
        } else {
            favoriteBtn.textContent = 'Adicionar aos Favoritos';
            favoriteBtn.classList.remove('btn-danger');
            favoriteBtn.classList.add('btn-secondary');
        }
    }
    
    // Vota review como útil
    async function voteUseful(reviewId) {
        if (!currentUser) {
            alert('Precisa de fazer login para votar.');
            window.location.href = '/frontoffice/login';
            return;
        }
        
        try {
            const response = await fetch(`/api/reviews/${reviewId}/vote`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
            
            if (response.ok) {
                // Recarrega reviews
                await loadMovieDetails();
            }
        } catch (error) {
            alert('Erro ao registar voto.');
        }
    }
    
    // Envia nova review
    async function submitReview(event) {
        event.preventDefault();
        
        if (!currentUser) {
            alert('Precisa de fazer login para adicionar uma avaliação.');
            window.location.href = '/frontoffice/login';
            return;
        }
        
        const rating = document.getElementById('review-rating').value;
        const comment = document.getElementById('review-comment').value;
        
        if (!rating || !comment.trim()) {
            alert('Preencha todos os campos.');
            return;
        }
        
        try {
            const response = await fetch('/api/reviews', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify({
                    movie_id: currentMovieId,
                    rating: parseInt(rating),
                    comment: comment.trim()
                })
            });
            
            if (response.ok) {
                alert('Avaliação publicada com sucesso!');
                document.getElementById('review-form').reset();
                await loadMovieDetails(); // Recarrega tudo
            }
            
        } catch (error) {
            alert('Erro ao publicar avaliação.');
        }
    }
    
    // Quando a página carrega
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Verifica autenticação
        checkAuth();
        
        // 2. Carrega detalhes do filme
        loadMovieDetails();
        
        // 3. Configura formulário de review
        const reviewForm = document.getElementById('review-form');
        if (reviewForm) {
            reviewForm.addEventListener('submit', submitReview);
        }
    });
</script>
</body>
